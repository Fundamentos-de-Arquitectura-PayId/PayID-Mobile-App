name: Build APK

# - Push a main: compila y deja el APK como artefacto de la ejecución.
# - Run workflow (manual) o push de un tag v*: además publica/actualiza el
#   GitHub Release con App-PayID.apk (enlace de descarga directa del README).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Misma versión usada en desarrollo (pubspec exige Dart ^3.13.7)
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk App-PayID.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-PayID-${{ github.run_number }}
          path: App-PayID.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # version: 1.0.0+1 -> v1.0.0
            v=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PayID Mobile ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: App-PayID.apk
          body: |
            APK de PayID Mobile conectado al backend `https://payid-backend-n573.onrender.com`.

            **Instalación (Android):** descarga `App-PayID.apk` desde el teléfono, ábrelo y, si Android lo pide, permite instalar apps de orígenes desconocidos.
